<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123b32">
    <title>Jogo de 21 — Blackjack</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='game.js') }}" defer></script>
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Jogo de 21, início"><span class="brand-mark">21</span><span>Jogo de <strong>21</strong></span></a>
        <div class="balance-box"><span>SEU SALDO</span><strong id="balance">R$ 100,00</strong></div>
        <div class="topbar-spacer" aria-hidden="true"></div>
      </header>

      <div class="game-layout">
        <section class="controls" aria-label="Controles do jogo">
          <div class="controls-heading"><span class="eyebrow">SUA JOGADA</span><h2>Controles</h2></div>
          <div class="bet-controls" id="bet-controls">
            <label for="bet-input">Sua aposta</label>
            <div class="bet-entry"><span>R$</span><input id="bet-input" type="number" min="1" step="1" value="10" inputmode="decimal"><button class="button button-primary" id="start-button">Começar rodada</button></div>
          </div>
          <div class="action-controls" id="action-controls" hidden>
            <button class="button button-hit" id="hit-button"><span class="button-icon">＋</span> Comprar carta</button>
            <button class="button button-stand" id="stand-button">Parar</button>
          </div>
          <div class="finished-controls" id="finished-controls" hidden>
            <button class="button button-primary" id="next-button">Jogar novamente</button>
            <button class="button button-quiet" id="reset-button">Reiniciar saldo</button>
          </div>
          <p class="fine-print">Jogo demonstrativo com fichas fictícias. Sem dinheiro real.</p>
        </section>

        <section class="table" aria-label="Mesa de blackjack">
          <div class="table-label"><span class="live-dot"></span> MESA PRINCIPAL <span class="table-divider">·</span> DEALER PARA NO 17</div>

          <section class="hand-area dealer-area" aria-labelledby="dealer-title">
            <div class="hand-heading"><div><span class="eyebrow">A BANCA</span><h2 id="dealer-title">Dealer</h2></div><div class="score" id="dealer-score">—</div></div>
            <div class="cards" id="dealer-cards" aria-label="Cartas do dealer"></div>
          </section>

          <div class="round-message" id="message" role="status" aria-live="polite">Faça sua aposta para começar uma rodada.</div>

          <section class="hand-area player-area" aria-labelledby="player-title">
            <div class="hand-heading"><div><span class="eyebrow">SUA MÃO</span><h2 id="player-title">Jogador</h2></div><div class="score" id="player-score">—</div></div>
            <div class="cards" id="player-cards" aria-label="Suas cartas"></div>
          </section>

          <div class="table-decoration" aria-hidden="true"><span>♠</span><span>♥</span><span>♣</span><span>♦</span></div>
        </div>
        <footer>♣ &nbsp; Boa sorte e divirta-se &nbsp; ♣</footer>
    </main>
  </body>
</html>
